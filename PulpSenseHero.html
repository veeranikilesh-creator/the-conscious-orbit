<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulpSense — Ultra-Luxury Red & Gold Hero</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#FCFAF7] p-4 sm:p-6 md:p-10 font-sans text-[#111827] min-h-screen flex items-center justify-center">

  <!-- Outer Rounded Container with 28px radius & Crimson Radial Glow -->
  <div class="relative w-full max-w-7xl overflow-hidden rounded-[28px] border border-[#D4AF37]/50 bg-[#FFFFFF] shadow-2xl">
    
    <!-- Crimson Radial Background Glow at the bottom -->
    <div 
      class="pointer-events-none absolute inset-x-0 bottom-0 h-[480px] w-full opacity-50"
      style="background: radial-gradient(ellipse at bottom, rgba(122, 0, 24, 0.22) 0%, rgba(212, 175, 55, 0.12) 35%, rgba(255, 255, 255, 0) 75%);"
    ></div>

    <!-- Ambient Top Glow Dots -->
    <div class="pointer-events-none absolute -left-20 -top-20 h-72 w-72 rounded-full bg-[#7A0018]/10 blur-[90px]"></div>
    <div class="pointer-events-none absolute -right-20 -top-20 h-72 w-72 rounded-full bg-[#D4AF37]/15 blur-[90px]"></div>

    <!-- ================= NAVBAR ================= -->
    <nav class="relative z-20 flex items-center justify-between px-6 py-5 md:px-10 md:py-6 border-b border-[#E6C878]/40 bg-[#FFFFFF]/90 backdrop-blur-xl">
      <!-- Left: Logo with icon + wordmark -->
      <div class="flex items-center gap-2.5 cursor-pointer group">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-[#7A0018] to-[#4C0519] text-white shadow-[0_0_15px_rgba(212,175,55,0.4)] border border-[#D4AF37] group-hover:scale-105 transition-transform">
          <svg class="w-5 h-5 fill-white text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-[#111827]">
          Pulp<span class="text-[#7A0018]">Sense</span>
        </span>
      </div>

      <!-- Center Navigation Links -->
      <div class="hidden items-center gap-1 rounded-full border border-[#E6C878] bg-[#FFFCF7] px-4 py-1.5 backdrop-blur-md md:flex">
        <a href="#testimonials" class="rounded-full px-3.5 py-1.5 text-xs font-medium text-[#4B5563] transition-all hover:bg-[#FBF3D5] hover:text-[#7A0018]">Testimonials</a>
        <a href="#services" class="rounded-full px-3.5 py-1.5 text-xs font-medium text-[#4B5563] transition-all hover:bg-[#FBF3D5] hover:text-[#7A0018]">Services</a>
        <a href="#casestudies" class="rounded-full px-3.5 py-1.5 text-xs font-medium text-[#4B5563] transition-all hover:bg-[#FBF3D5] hover:text-[#7A0018]">Case Studies</a>
        <a href="#process" class="rounded-full px-3.5 py-1.5 text-xs font-medium text-[#4B5563] transition-all hover:bg-[#FBF3D5] hover:text-[#7A0018]">Process</a>
        <a href="#contact" class="rounded-full px-3.5 py-1.5 text-xs font-medium text-[#4B5563] transition-all hover:bg-[#FBF3D5] hover:text-[#7A0018]">Contact</a>
      </div>

      <!-- Right: Royal Red button with Gold Glow -->
      <button class="group relative inline-flex items-center gap-2 overflow-hidden rounded-full bg-[#7A0018] px-5 py-2.5 text-xs font-semibold text-white shadow-[0_0_20px_rgba(212,175,55,0.35)] transition-all hover:bg-[#8E1538] hover:scale-[1.03] cursor-pointer">
        <span>Book Your Call</span>
        <svg class="w-3.5 h-3.5 transition-transform group-hover:rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
      </button>
    </nav>

    <!-- ================= HERO CONTENT (CENTERED) ================= -->
    <div class="relative z-10 flex flex-col items-center justify-center px-6 pb-20 pt-10 text-center md:px-12 md:pb-28 md:pt-14">
      
      <!-- Small Pill Badge — Follows H6 Font Size with Extra-Bold Gold Border & Champagne Text on Royal Red -->
      <h6 class="inline-flex items-center gap-2 rounded-full border-2 border-[#D4AF37] bg-[#7A0018] px-5 py-2 text-xs sm:text-sm font-extrabold text-[#E6C878] shadow-[0_0_15px_rgba(212,175,55,0.4)] backdrop-blur-sm">
        <span class="text-amber-500 font-black">⚡</span>
        <span class="font-extrabold uppercase tracking-wider">AI Automation</span>
      </h6>

      <!-- Large Minimal Headline (2 lines) -->
      <h1 class="mt-6 max-w-4xl text-4xl font-normal tracking-tight text-[#111827] sm:text-6xl lg:text-7xl leading-[1.12]">
        Grow your business, <br class="hidden sm:inline" />
        <span class="bg-gradient-to-r from-[#111827] via-[#7A0018] to-[#D4AF37] bg-clip-text text-transparent font-semibold">
          not your payroll
        </span>
      </h1>

      <!-- Subheading Tagline -->
      <p class="mt-5 max-w-2xl text-sm font-medium text-[#4B5563] sm:text-base md:text-lg leading-relaxed">
        Put your client acquisition, operations, and 
        <span class="relative inline-block font-medium text-[#111827]">
          the daily grind on autopilot
          <!-- Gold gradient underline -->
          <span class="absolute -bottom-1 left-0 h-[3px] w-full rounded-full bg-gradient-to-r from-[#7A0018] via-[#D4AF37] to-[#10B981]"></span>
        </span>
      </p>

      <!-- Dual Pill Action Buttons -->
      <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row sm:gap-4">
        <!-- Primary Pill Button -->
        <button class="group flex w-full items-center justify-center gap-2 rounded-full bg-[#7A0018] px-8 py-3.5 text-sm font-semibold text-white shadow-[0_0_25px_rgba(212,175,55,0.4)] transition-all hover:bg-[#8E1538] hover:scale-[1.03] cursor-pointer sm:w-auto">
          <span>Book Your Call</span>
          <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>

        <!-- Secondary Pill Button -->
        <button class="flex w-full items-center justify-center gap-2 rounded-full border border-[#D4AF37] bg-[#FFFFFF] px-8 py-3.5 text-sm font-medium text-[#7A0018] transition-all hover:bg-[#FFFCF7] cursor-pointer sm:w-auto">
          <span>View Services</span>
        </button>
      </div>

      <!-- Overlapping Profile Avatars & Social Proof -->
      <div class="mt-12 flex items-center justify-center gap-3">
        <!-- Avatar stack -->
        <div class="flex -space-x-3 overflow-hidden">
          <img class="inline-block h-9 w-9 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar 1">
          <img class="inline-block h-9 w-9 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80" alt="Avatar 2">
          <img class="inline-block h-9 w-9 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Avatar 3">
          <img class="inline-block h-9 w-9 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80" alt="Avatar 4">
          <img class="inline-block h-9 w-9 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=100&auto=format&fit=crop&q=80" alt="Avatar 5">
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#7A0018] font-mono text-[0.68rem] font-bold text-white ring-2 ring-white">
            +499
          </div>
        </div>

        <!-- Caption -->
        <div class="text-left text-xs text-[#6B7280]">
          <span class="font-semibold text-[#111827]">Trusted by 100+ businesses</span>
          <br />
          <span>scaling on autopilot</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
